<text x="60" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#111827">Mohammed Thowfik I</text>

<rect x="60" y="146" width="230" height="6" rx="3" fill="url(#accentGrad)"/>

<text x="60" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#2563EB">Cybersecurity Student</text>

<text x="60" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#4B5563">B.E. Computer Science and Engineering (Cyber Security)</text>

<text x="60" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280">KGiSL Institute of Technology · Coimbatore, Tamil Nadu</text>

<text x="60" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-style="italic" font-weight="400" fill="#111827">"Securing today's systems for tomorrow's world."</text>

<text x="60" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#2563EB">TECH STACK</text>

