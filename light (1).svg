<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohammed Thowfik I, Cybersecurity Student, GitHub profile banner">
<title>Mohammed Thowfik I — Cybersecurity Student</title>
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F5F7FA"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2563EB"/>
    <stop offset="100%" stop-color="#60A5FA"/>
  </linearGradient>
  <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#F5F7FA"/>
    <stop offset="100%" stop-color="#EEF2F7"/>
  </linearGradient>
  <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#D1D5DB" opacity="0.55"/>
  </pattern>
  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#111827" flood-opacity="0.16"/>
  </filter>
  <clipPath id="canvasClip"><rect x="0" y="0" width="1280" height="640" rx="18"/></clipPath>
  <clipPath id="photoClip"><circle cx="970" cy="195" r="112"/></clipPath>
</defs>

<g clip-path="url(#canvasClip)">
<rect width="1280" height="640" fill="url(#bgGrad)"/>
<rect width="1280" height="640" fill="url(#dotGrid)"/>

<g stroke="#D1D5DB" stroke-width="1" opacity="0.5">
  <line x1="0" y1="60" x2="1280" y2="60"/>
  <line x1="0" y1="580" x2="1280" y2="580"/>
</g>

<g fill="none" stroke="#2563EB" stroke-width="1.2" opacity="0.08">
