    <ellipse cx="0" cy="10" rx="30" ry="18"/>
    <ellipse cx="24" cy="4" rx="20" ry="14"/>
    <ellipse cx="-20" cy="6" rx="17" ry="12"/>
    <animateTransform attributeName="transform" type="translate" values="770,115; 770,107; 770,115" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- ===== circular profile photo with cyan glow ===== -->
