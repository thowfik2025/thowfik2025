  <g fill="#38BDF8" opacity="0.55" font-family="Consolas, monospace" font-size="12">
    <text x="1150" y="230">1</text>
    <text x="1190" y="260">0</text>
    <text x="1160" y="290">1</text>
  </g>
  <g fill="#38BDF8" opacity="0.6">
    <circle cx="1150" cy="330" r="3">
      <animate attributeName="cy" values="330;300;330" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="380" r="3">
      <animate attributeName="cy" values="380;350;380" dur="9s" repeatCount="indefinite"/>
    </circle>
