      <rect x="-26" y="-8" width="52" height="42" rx="6" fill="#38BDF8"/>
      <path d="M-16,-8 V-24 a16,16 0 0 1 32,0 V-8" fill="none" stroke="#38BDF8" stroke-width="6"/>
      <circle cx="0" cy="10" r="5" fill="#0D1117"/>
    </g>
  </g>

