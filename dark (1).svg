<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mohammed Thowfik I, Cybersecurity Student, GitHub profile banner, dark mode">
<title>Mohammed Thowfik I — Cybersecurity Student</title>
<defs>
  <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#161B22"/>
  </linearGradient>
  <linearGradient id="accentGradD" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#0EA5E9"/>
  </linearGradient>
  <linearGradient id="panelGradD" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#161B22"/>
    <stop offset="100%" stop-color="#0D1117"/>
  </linearGradient>
  <pattern id="dotGridD" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.2" r="1.2" fill="#30363D" opacity="0.7"/>
  </pattern>
  <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="photoGlowD" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <clipPath id="canvasClipD"><rect x="0" y="0" width="1280" height="640" rx="18"/></clipPath>
  <clipPath id="photoClipD"><circle cx="970" cy="195" r="112"/></clipPath>
</defs>

<g clip-path="url(#canvasClipD)">
<rect width="1280" height="640" fill="url(#bgGradD)"/>
<rect width="1280" height="640" fill="url(#dotGridD)"/>

<g stroke="#30363D" stroke-width="1" opacity="0.6">
  <line x1="0" y1="60" x2="1280" y2="60"/>
  <line x1="0" y1="580" x2="1280" y2="580"/>
</g>

<g fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.15">
  <polygon points="150,40 190,64 190,112 150,136 110,112 110,64"/>
  <polygon points="60,420 100,444 100,492 60,516 20,492 20,444"/>
  <polygon points="1080,40 1120,64 1120,112 1080,136 1040,112 1040,64"/>
</g>

<!-- ===================== LEFT CONTENT ===================== -->
<text x="60" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#F8FAFC">Mohammed Thowfik I</text>

<rect x="60" y="146" width="230" height="6" rx="3" fill="url(#accentGradD)"/>

<text x="60" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#38BDF8">Cybersecurity Student</text>

<text x="60" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#CBD5E1">B.E. Computer Science and Engineering (Cyber Security)</text>

<text x="60" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">KGiSL Institute of Technology · Coimbatore, Tamil Nadu</text>

<text x="60" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-style="italic" font-weight="400" fill="#F8FAFC">"Securing today's systems for tomorrow's world."</text>

<text x="60" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#38BDF8">TECH STACK</text>

