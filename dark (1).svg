    <circle cx="1140" cy="430" r="6"><animate attributeName="r" values="6;9;6" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="470" r="6"><animate attributeName="r" values="6;9;6" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

