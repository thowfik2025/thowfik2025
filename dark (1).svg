    <circle cx="970" cy="195" r="128" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="195" r="121" fill="none" stroke="url(#accentGradD)" stroke-width="6" filter="url(#photoGlowD)"/>
    <image href="MohammedThowfikI.png" x="858" y="83" width="224" height="224" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClipD)"/>
    <circle cx="970" cy="195" r="112" fill="none" stroke="#0D1117" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- terminal window -->
