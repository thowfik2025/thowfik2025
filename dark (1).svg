<!-- ===================== RIGHT ILLUSTRATION ===================== -->
<g aria-label="cybersecurity themed illustration with profile photo">
  <rect x="720" y="80" width="500" height="480" rx="24" fill="url(#panelGradD)" stroke="#30363D"/>

  <!-- circuit paths -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.4">
    <path d="M735 250 H775 V280 H810"/>
    <path d="M1200 500 H1120 V460 H1090"/>
    <path d="M760 520 H820 V550"/>
  </g>
  <g fill="#38BDF8" opacity="0.6">
    <circle cx="735" cy="250" r="4"/>
    <circle cx="810" cy="280" r="4"/>
    <circle cx="1200" cy="500" r="4"/>
    <circle cx="1090" cy="460" r="4"/>
  </g>

  <!-- hexagon outlines -->
  <g fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.3">
    <polygon points="1150,120 1180,138 1180,174 1150,192 1120,174 1120,138"/>
    <polygon points="1150,480 1176,495 1176,525 1150,540 1124,525 1124,495"/>
  </g>

  <!-- cloud -->
