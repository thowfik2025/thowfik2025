  <g stroke="#38BDF8" stroke-width="1.4" opacity="0.6" fill="none">
    <line x1="1130" y1="340" x2="1180" y2="380"/>
    <line x1="1180" y1="380" x2="1140" y2="430"/>
    <line x1="1140" y1="430" x2="1190" y2="470"/>
  </g>
  <g fill="url(#accentGradD)">
