    <rect x="0" y="0" width="150" height="96" rx="10" fill="#010409" stroke="#30363D"/>
    <circle cx="16" cy="16" r="4" fill="#F87171"/>
    <circle cx="30" cy="16" r="4" fill="#FBBF24"/>
    <circle cx="44" cy="16" r="4" fill="#34D399"/>
    <text x="14" y="42" font-family="Consolas, monospace" font-size="12" fill="#38BDF8">$ whoami</text>
    <text x="14" y="60" font-family="Consolas, monospace" font-size="12" fill="#F8FAFC">thowfik</text>
    <rect x="14" y="70" width="8" height="12" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- shield with lock -->
